name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Fetch fonts
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          base="https://raw.githubusercontent.com/google/fonts/main/ofl"
          dl() { curl -fsSL "$base/$1" -o "app/src/main/assets/fonts/$2" || rm -f "app/src/main/assets/fonts/$2"; }
          dl 'nunito/Nunito%5Bwght%5D.ttf' Nunito.ttf
          dl 'quicksand/Quicksand%5Bwght%5D.ttf' Quicksand.ttf
          dl 'fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf' Fredoka.ttf

      - name: Build
        shell: bash
        run: gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Errors
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|Caused by' -A3 build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | cut -c1-300 | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EdgeBackCustomizer
          path: app/build/outputs/apk/release/*.apk
