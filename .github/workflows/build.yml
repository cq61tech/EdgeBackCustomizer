name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -nE "^e: |error:|What went wrong|Execution failed|Caused by|requires" -A4 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EdgeBackCustomizer-debug
          path: app/build/outputs/apk/debug/*.apk
